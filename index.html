<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura World</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#2a1730;--mute:#7d6585;--line:#f0d6e0;--acc:#e8457c;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1022;--card:#261633;--ink:#fbeaf3;--mute:#b39bc0;--line:#3d2750;--acc:#ff5c93;--ai:#2a0a17}}
:root[data-theme="dark"]{--bg:#1a1022;--card:#261633;--ink:#fbeaf3;--mute:#b39bc0;--line:#3d2750;--acc:#ff5c93;--ai:#2a0a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
h2,b,.f{font-family:Fredoka,system-ui,sans-serif}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;min-width:1px;min-height:1px;touch-action:none;display:block;z-index:0}
canvas{display:block}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--line)}
nav button{background:none;border:0;color:var(--mute);padding:8px 0 6px;font:600 12px Fredoka,sans-serif;min-height:56px;cursor:pointer}
nav button span{display:block;font-size:22px;transition:transform .2s}
nav button.on{color:var(--acc)}nav button.on span{transform:translateY(-3px) scale(1.2)}
button{font:inherit}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hb{background:rgba(20,10,30,.62);color:#fff;border-radius:14px;padding:8px 10px;min-width:170px;max-width:230px;font-size:12px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#4ade80;transition:width .15s}
.tkb{background:rgba(20,10,30,.62);color:#fff;border-radius:999px;padding:6px 12px;font:700 16px Fredoka,sans-serif;align-self:flex-start}
#qs div{opacity:.9}
#ab{position:absolute;right:14px;bottom:18px;width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:var(--acc);color:var(--ai);font:700 12px/1.1 Fredoka,sans-serif;padding:6px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#ab:active{transform:scale(.93)}#ab.cd{filter:grayscale(.8);opacity:.7}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,0);background:#fff;color:#2a1730;font:700 17px Fredoka,sans-serif;padding:8px 16px;border-radius:12px;opacity:0;pointer-events:none;text-align:center}
#toast.show{animation:tst 2s ease}
@keyframes tst{0%{opacity:0;transform:translate(-50%,20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.pn{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:14px;display:none;z-index:5}
.pn.on{display:block}
h2{margin:0 0 8px;font-size:22px;color:var(--acc)}
.rr{display:flex;gap:8px;margin:10px 0}
.rr button{flex:1;border:0;border-radius:12px;background:var(--acc);color:var(--ai);font-weight:700;padding:14px;min-height:48px;cursor:pointer}
.rr button:disabled{opacity:.4}
.orbw{height:150px;display:grid;place-items:center;overflow:hidden}
.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c,#e8457c) 60%,#2a1730);box-shadow:0 0 30px var(--c,#e8457c);display:grid;place-items:center;font-size:36px}
.orb.shake{animation:shk 1.2s ease-in}
@keyframes shk{0%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-18deg) scale(1.05)}40%{transform:rotate(18deg) scale(1.1)}60%{transform:rotate(-22deg) scale(1.2);box-shadow:0 0 60px var(--c)}85%{transform:scale(1.5);filter:brightness(1.6)}100%{transform:scale(3);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.cd{position:relative;border-radius:14px;border:3px solid var(--rc);padding:6px 4px;text-align:center;color:#fff;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(160deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 50) 60% 34%));cursor:pointer}
.cd i{font:700 10px Fredoka,sans-serif;font-style:normal;background:var(--rc);color:#1a1022;border-radius:6px;padding:1px 6px}
.cd b{font-size:32px;line-height:1}
.cd span{font-size:12px;font-weight:700;line-height:1.1}
.cd small{font-size:10px;opacity:.85}
.cd em{font-size:10px;font-style:normal;background:rgba(0,0,0,.35);border-radius:6px;padding:1px 5px}
.cd u{position:absolute;top:2px;right:4px;font-size:10px;text-decoration:none;font-weight:700}
.cd.lock{background:var(--card);color:var(--mute);border-style:dashed}
.cd.sel{outline:3px solid var(--ink);outline-offset:2px}
.cd.sec{animation:rb 2s linear infinite}
@keyframes rb{0%,100%{border-color:#ffd84d}33%{border-color:#4ff}66%{border-color:#f6f}}
.cd.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1) both}
.cd.new::after{content:"YENİ";position:absolute;top:-8px;left:-6px;background:#ffd84d;color:#2a1730;font:700 10px Fredoka,sans-serif;padding:2px 6px;border-radius:6px;transform:rotate(-8deg)}
@keyframes pp{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.info{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.od{color:var(--mute);font-size:12px}
#win{position:absolute;inset:0;background:rgba(20,10,30,.85);color:#fff;display:none;place-items:center;text-align:center;z-index:9;padding:20px}
#win.on{display:grid}
#win button{border:0;border-radius:12px;background:var(--acc);color:var(--ai);font-weight:700;padding:12px 20px;margin-top:12px}
.ic{width:28px;height:28px}.tkb{display:flex;align-items:center;gap:6px}.tkb .ic{width:22px;height:22px}
nav .ic{display:block;margin:0 auto 2px;transition:transform .2s}nav button.on .ic{transform:translateY(-3px) scale(1.2)}
.cd img{width:62px;height:74px;object-fit:contain;margin-top:2px}
#say{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);width:min(86%,420px);background:rgba(20,10,30,.82);color:#fff;border:2px solid var(--acc);border-radius:14px;padding:10px 14px;text-align:center;opacity:0;pointer-events:none;font-size:14px}
#say.show{animation:sy 7s ease}
@keyframes sy{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}
#acts{z-index:4;position:absolute;right:8px;bottom:10px;width:220px;height:176px;pointer-events:none}
#acts button{position:absolute;pointer-events:auto;border:3px solid #fff;border-radius:50%;color:#fff;font:700 9px/1.05 Fredoka,sans-serif;padding:3px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.4);touch-action:none;cursor:pointer}
#acts button:active{transform:scale(.92)}
#bA{right:0;bottom:0;width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#ff9ab8,var(--acc));font-size:15px!important}
#b1{right:94px;bottom:0;width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#8ec5ff,#3f6fd8)}
#b2{right:80px;bottom:68px;width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#c9a0ff,#7a3fd8)}
#bU{right:6px;bottom:94px;width:70px;height:70px;background:linear-gradient(to top,#ffb347 var(--e,0%),#4a3a5a var(--e,0%))}
#bU.rdy{animation:ur .6s infinite alternate;background:radial-gradient(circle,#fff3a0,#ff9a1f)}
@keyframes ur{to{transform:scale(1.12);box-shadow:0 0 22px #ffb347}}
#bD{right:162px;bottom:26px;width:48px;height:48px;background:radial-gradient(circle at 35% 30%,#9fffd0,#2fa86a)}
#acts button.cdn{filter:grayscale(.85) brightness(.7);font-size:20px!important}
#p-roll.on{display:flex;gap:12px;padding:10px}
#chl{width:42%;min-width:230px;overflow:auto}#chr{flex:1;overflow:auto;min-width:0}
@media (max-aspect-ratio:1/1){#p-roll.on{flex-direction:column;overflow:auto}#chl,#chr{width:auto;overflow:visible}}
.chi{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px;cursor:pointer}
.chi.on{border-color:var(--acc)}.chi.lk{opacity:.5}.chi.pm{border-color:#d8a84a;background:linear-gradient(90deg,rgba(216,168,74,.2),var(--card))}
.chi small{display:block;color:var(--mute);font-size:12px}.chi canvas{flex:none;width:44px;height:44px;position:static}
#fs{position:absolute;top:62px;right:8px;background:rgba(20,10,30,.62);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:600 12px Fredoka,sans-serif;cursor:pointer}
.grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.cd{min-height:200px;background:linear-gradient(180deg,hsl(var(--h) 35% 22%),hsl(calc(var(--h) + 40) 40% 12%));padding:6px 4px 8px}
.cd img{width:100%;max-width:130px;height:auto;aspect-ratio:4/5;object-fit:contain;margin:2px 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.cd.lock img.sil{opacity:.55;filter:none}
.cd span{font-size:13px}
#rres{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
@media (prefers-reduced-motion:reduce){.orb.shake,.cd.sec,.cd.pop{animation:none}}

/* yatay ekran */
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav{position:fixed;left:10px;top:60px;z-index:60;display:none;grid-template-columns:1fr;width:164px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
body.mo nav{display:grid}
nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 10px;font-size:14px;text-align:left;border-radius:10px;width:100%}
nav button.on{background:rgba(232,69,124,.14)}
nav .ic{margin:0;flex:none}nav button.on .ic{transform:none}
#mb{position:fixed;left:10px;top:10px;z-index:61;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:var(--acc);color:#fff;font-size:20px;line-height:1;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer}
.hud{left:60px}
#chl h2,#p-chars h2,#p-items h2{padding-left:46px}
#mm{position:absolute;top:50px;right:8px;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(20,10,30,.55);pointer-events:none}
@media (orientation:landscape) and (max-height:480px){.hb{font-size:11px;min-width:150px;padding:5px 8px}.orbw{height:110px}.orb{width:76px;height:76px;font-size:28px}.rr button{padding:8px;min-height:40px}.rr{margin:6px 0}}
#rot{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}
@media (orientation:portrait){#rot{display:grid}}
#p-chars.on,#p-items.on{display:grid;grid-template-columns:minmax(250px,38%) 1fr;grid-template-rows:auto minmax(0,1fr);gap:6px 12px;overflow:hidden}
#p-chars h2,#p-items h2{grid-column:1/-1;margin:0}
#cinfo,#iinfo{overflow:auto;margin:0;grid-row:2}#cgrid,#igrid{overflow:auto;grid-row:2;align-content:start}
@media (max-aspect-ratio:1/1){#p-chars.on,#p-items.on{display:block;overflow:auto}#cinfo,#cgrid,#iinfo,#igrid{overflow:visible}}
.ch-top{display:flex;gap:10px;align-items:center;margin-bottom:6px}.ch-top img{width:76px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.ch-st{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0;font-size:13px}.ch-st div{background:var(--bg);border-radius:8px;padding:4px 8px}
.lvb{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.lvb i{display:block;height:100%;background:var(--acc)}
.up{display:block;width:100%;border:0;border-radius:10px;background:var(--acc);color:var(--ai);font:700 14px Fredoka,sans-serif;padding:10px;margin-top:6px;min-height:44px;cursor:pointer}.up:disabled{opacity:.4}
.sk{font-size:12px;color:var(--mute);margin:2px 0}

.ic{width:28px;height:28px}.sk .ic,.od .ic,.up .ic{width:16px;height:16px;vertical-align:-3px}.rw .ic{width:22px;height:22px}
nav{max-height:calc(100% - 70px);overflow-y:auto}
#acts{right:calc(8px + var(--bx,0px));bottom:calc(10px + var(--by,0px));transform-origin:100% 100%;transform:scale(var(--bs,1));opacity:var(--bo,1)}
body.lh #acts{right:auto;left:calc(8px + var(--bx,0px));transform-origin:0 100%;transform:scale(calc(var(--bs,1)*-1),var(--bs,1))}
body.lh #acts button{transform:scaleX(-1)}body.lh #acts button:active{transform:scale(-.92,.92)}body.lh #bU.rdy{animation:none;box-shadow:0 0 22px #ffb347}
#p-more.on{display:block}.mt{display:flex;gap:6px;margin:0 0 8px 46px;flex-wrap:wrap}.mt .up,.rw .up{width:auto;margin:0;padding:8px 12px;min-height:38px}
.up.off{background:var(--line);color:var(--ink)}.up:disabled{opacity:.4}
.rw{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px;flex-wrap:wrap}.rw>div{flex:1;min-width:120px}.rw.sl{border-color:var(--acc)}.rw input[type=range]{flex:1;min-width:120px}.rw .lvb{margin-top:4px}

/* v3 arayuz: ust bildirim cubugu, sonuc ekrani, kompakt kartlar */
#toast,#say{display:none!important}
#nt{position:absolute;top:8px;left:300px;right:270px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:14}
@media (max-width:760px){#nt{left:200px;right:200px}}
#nt .n{max-width:100%;background:rgba(20,10,30,.82);color:#fff;border:1.5px solid var(--acc);border-radius:10px;padding:4px 12px;font:600 12px/1.25 Fredoka,system-ui,sans-serif;text-align:center;opacity:0;animation:ntf 3s ease forwards}
#nt .n.s{border-color:#ffd84d;font-size:11px;background:rgba(40,26,6,.85)}
@keyframes ntf{0%{opacity:0;transform:translateY(-8px)}8%,86%{opacity:1;transform:none}100%{opacity:0}}
#rov{position:absolute;inset:0;z-index:20;background:rgba(14,6,24,.94);color:#fff;display:none;flex-direction:column;gap:6px;padding:8px 12px 10px}
#rov.on{display:flex}
#rovh{text-align:center;flex:none}#rovt{font:700 20px Fredoka,sans-serif;color:#ffd84d}
#rovg{flex:1;min-height:0;display:grid;gap:8px;align-content:center;justify-content:center;padding-top:8px}
#rovg.g1{grid-template-rows:minmax(0,1fr)}
#rovg.g5{grid-template-rows:minmax(0,1fr)}
#rovg.g10{grid-template-rows:repeat(2,minmax(0,1fr))}
#rovg .cd{min-height:0;height:100%;min-width:0;padding:4px 3px 5px;justify-content:space-between;overflow:visible}
#rovg .cd img{flex:1 1 0;min-height:0;width:100%;max-width:none;height:auto;aspect-ratio:auto;object-fit:contain;margin:1px 0}
#rovg .cd .ic{flex:none;width:44px;height:44px}
#rovg .cd span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rovg .cd small{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rovg.g10 .cd small,#rovg.g10 .cd em{display:none}
#rovg.g10 .cd span{font-size:11px}
#rovg .cd em{font-size:9px}
#rovf{display:flex;gap:10px;justify-content:center;flex:none}
#rovf button{width:auto;min-width:150px;margin:0}
@media (max-height:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.cd{min-height:168px}.cd img{max-width:96px}}

/* ===== PC kontrolleri: klavye + fare + gamepad ===== */
@media (pointer:fine){#rot{display:none!important}}
body.aimcur #cv{cursor:none}
.pf{outline:3px solid #ffd84d!important;outline-offset:3px;box-shadow:0 0 0 7px rgba(255,216,77,.28)!important;border-radius:10px}
.cd.pf,.chi.pf{border-radius:14px}
#padhold{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;background:rgba(20,10,30,.88);color:#fff;border:2px solid var(--acc);border-radius:12px;padding:6px 14px;font:600 12px Fredoka,system-ui,sans-serif;display:none;min-width:150px;text-align:center}
#padhold i{display:block;height:5px;border-radius:5px;background:var(--acc);width:0;margin-top:5px}

/* Sakura Pass integration */
#p-pass.on{display:block;overflow:auto}
.pass-head{background:linear-gradient(135deg,#3b1745,#9d315f 58%,#f08ab0);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #5a174433}
.pass-head h2{color:#fff;margin:0 0 5px}.pass-sub{font-size:12px;opacity:.9}.pass-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-weight:700}
.pass-progress{height:10px;border-radius:20px;background:#ffffff44;overflow:hidden;margin:8px 0}.pass-progress i{display:block;height:100%;background:#ffe28a;width:0}
.pass-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pass-actions button{flex:1;min-width:130px}
.pass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.pass-tier{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px;min-width:0}
.pass-tier.current{border-color:var(--acc);box-shadow:0 0 0 2px #e8457c22}
.pass-tier.done{opacity:.78}.pass-tier b{font-family:Fredoka,sans-serif}.pass-tier .tier-no{display:flex;justify-content:space-between;align-items:center;color:var(--acc);margin-bottom:5px}
.pass-reward{font-size:12px;line-height:1.35;min-height:34px;margin:4px 0}.pass-reward.premium{color:#bd7b16}.pass-tier button{width:100%;margin-top:5px;min-height:34px;padding:6px;border:0;border-radius:8px;background:var(--acc);color:white;font-weight:700}.pass-tier button:disabled{opacity:.45}
.pass-quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:10px 0}.pass-quest{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}.pass-quest button{margin-top:6px;width:100%;border:0;border-radius:8px;padding:7px;background:#7b4cb5;color:#fff;font-weight:700}.pass-quest button:disabled{opacity:.45}
.pass-emotes{display:flex;gap:8px;flex-wrap:wrap}.pass-emote{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:100px;text-align:center;font-size:12px}.pass-emote strong{display:block;font-size:25px}
#emoteBtn{position:absolute;left:12px;bottom:18px;z-index:8;border:2px solid #fff;border-radius:50%;width:62px;height:62px;background:rgba(65,30,80,.86);color:#fff;font-size:25px;box-shadow:0 4px 12px #0006;cursor:pointer}
#emoteWheel{position:absolute;left:10px;bottom:88px;z-index:30;display:none;grid-template-columns:repeat(2,minmax(110px,1fr));gap:6px;max-width:min(360px,90vw);max-height:55%;overflow:auto;background:rgba(24,12,35,.96);border:2px solid #e8457c;border-radius:14px;padding:8px;color:#fff}
#emoteWheel.on{display:grid}#emoteWheel button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:9px;padding:8px;font-size:12px}#emoteWheel button strong{display:block;font-size:22px}
#emoteFloat{position:absolute;z-index:16;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;color:#fff;text-shadow:0 3px 10px #000;pointer-events:none;display:none;text-align:center}
#emoteFloat.show{display:block;animation:emotePop 1.7s ease forwards}@keyframes emotePop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%,75%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-48px) scale(.9)}}
@media(max-width:600px){.pass-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pass-tier{padding:7px}#emoteWheel{grid-template-columns:repeat(2,minmax(95px,1fr))}}


/* Sakura Pass v2 — yatay Royale Pass düzeni */
#p-pass.on{display:block;overflow:hidden;padding:10px;background:radial-gradient(ellipse at 20% 0%,#392044,#100d1a 72%);color:#fff}

function mouseTgt(){

  En.forEach(e=>{const h=Math.min(e.lh||e.r,e.r*1.6)*.6,d=Math.min(Math.hypot(e.x-wx,e.y-wy),Math.hypot(e.x-wx,e.y-h-wy));if(d<e.r+34&&d<bd){bd=d;b=e}});

function padTgt(){
  const m=Math.hypot(PAD.rx,PAD.ry);if(m<.3)return null;
  const a=Math.atan2(PAD.ry,PAD.rx);let best=null,bd=.6;
  En.forEach(e=>{const d=dist(e,P);if(d>470)return;const sz=Math.atan2(e.r,Math.max(d,1));let da=Math.abs(nrm(Math.atan2(e.y-P.y,e.x-P.x)-a));da=Math.max(0,da-sz);if(da<bd){bd=da;best=e}});
